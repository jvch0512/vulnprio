[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnprio"
version = "0.1.0"
description = "Risk-based vulnerability prioritization using CVSS, EPSS, CISA KEV and asset context"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vulnprio = "vulnprio.cli:main"

[tool.setuptools]
packages = ["vulnprio"]
